<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <!-- Created By Tandeep Phalora on November 13th -->
    <title>Assignment 3 - About Me</title>
    <meta charset="utf-8">

    <style>
      html {
        width: 1440px;
        margin: 0 auto;
      }

      body {
        background-color: #ffe6f0;
        font-family: "Open Sans", sans-serif;
        font-size: 16px;
        margin: 0;
        color: #333;
      }

      .logo {
        width: 50px;
        height: 50px;
        background-color: #fff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Oswald", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        position: absolute;
        top: 20px;
        left: 20px;
        border: 2px solid #333;
      }

      h1 {
        font-family: "Oswald", sans-serif;
        font-size: 32px;
        text-align: center;
        margin-top: 100px;
      }

      nav {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 30px;
      }

      nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      nav ul li {
        display: inline-block;
        margin: 0 12px;
      }

      nav ul li a {
        font-family: "Raleway", sans-serif;
        text-decoration: none;
        color: #333;
        padding: 12px 20px;
        border-radius: 6px;
      }

      nav ul li a:hover {
        background-color: #fff;
      }

      .main-container {
        width: 1200px;
        margin: 0 auto 60px auto;
      }

      .hero {
        width: 100%;
        height: 400px;
        margin-bottom: 40px;
        border-radius: 12px;
        overflow: hidden;
      }

      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .grid-4x1-row {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 40px;
      }

      .grid-4x1-item {
        width: 285px;
        height: 285px;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 12px;
      }

      .grid-4x1-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .grid-2x1-row {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 60px;
      }

      .grid-2x1-item {
        width: 590px;
        height: 250px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding: 0;
        font-size: 18px;
        line-height: 1.7;
        color: #333;
        border-radius: 12px;
        overflow: hidden;
      }

      .grid-2x1-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .footer {
        width: 100%;
        background-color: #ffd6e6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        font-size: 18px;
        padding: 25px;
        border-top: 2px solid #ffb3d9;
      }
    </style>
  </head>

  <body>
    <div class="logo">TP</div>

    <h1>About Me</h1>

    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="aboutme.html">About me</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="getintouch.html">Get in Touch</a></li>
      </ul>
    </nav>

    <div class="main-container">
      <div class="hero">
        <img src="banner.jpg" alt="Banner image">
      </div>

      <div class="grid-4x1-row">
        <div class="grid-4x1-item"><img src="cat.jpg" alt="sleepy cat"></div>
        <div class="grid-4x1-item"><img src="Product.JPG" alt="fit me foundation"></div>
        <div class="grid-4x1-item"><img src="Narrative.JPG" alt="women in purple"></div>
        <div class="grid-4x1-item"><img src="Fashion.JPG" alt="grey crocs with purple jibits"></div>
      </div>

      <div class="grid-2x1-row">
        <div class="grid-2x1-item">
          <img src="figma.jpg" alt="Figma project">
        </div>
        <div class="grid-2x1-item">
          <img src="film.jpg" alt="Film project">
        </div>
      </div>
    </div>

    <div class="footer">
      <p><a href="Tandeepphalora14@gmail.com">Tandeepphalora14@gmail.com</a></p>
    </div>
  </body>
</html>
